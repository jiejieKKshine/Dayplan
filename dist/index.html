<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>日序 · 让每一天从容有序</title><style>
:root{--ink:#253c36;--green:#3d6657;--muted:#8a948d;--line:#e7eae3;--paper:#fffefa}*{box-sizing:border-box}body{margin:0;background:#f5f6f0;color:var(--ink);font:14px 'Microsoft YaHei',sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;background:none;color:inherit}button:hover{filter:brightness(.95)}.app{display:grid;grid-template-columns:216px 1fr;min-height:100vh}aside{background:#edf0e7;padding:36px 22px;display:flex;flex-direction:column;border-right:1px solid #e2e6dc}.logo{font-size:26px;font-weight:750;letter-spacing:2px;display:flex;align-items:center;gap:12px}.mark{background:var(--green);color:white;border-radius:12px;padding:7px 10px;font-size:23px}.tagline{color:#8a9589;font-size:11px;letter-spacing:2px;margin:12px 0 45px}nav button{width:100%;text-align:left;margin:5px 0;padding:14px 18px;border-radius:9px;color:#788477}nav button.active{background:#dce5d7;color:#365b48;font-weight:700}.navicon{margin-right:14px}aside h4{font-size:10px;letter-spacing:2px;color:#96a08e;margin:36px 17px 17px}.filter{display:flex;align-items:center;gap:12px;padding:10px 17px;color:#69776b;cursor:pointer}.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}.filter input{margin-left:auto;accent-color:var(--green)}.asidebottom{margin-top:auto;padding:36px 10px 0;color:#8b9686;font-size:12px;line-height:1.9}.leaf{font-size:32px;margin-bottom:10px}main{padding:37px 38px;max-width:1800px;width:100%}.top{display:flex;align-items:center;justify-content:space-between;gap:20px}.eyebrow{color:#939d90;font-size:11px;letter-spacing:2px;margin-bottom:9px}h1{font-size:28px;font-weight:650;margin:0 0 10px;letter-spacing:1px}.subtitle{color:#929a90;font-size:12px}.actions{display:flex;gap:12px;align-items:center}.primary{background:var(--green);color:white;padding:13px 20px;border-radius:8px}.notification{border:1px solid #dce2d6;background:#fbfcf7;border-radius:8px;padding:12px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:17px;margin:30px 0}.stat{border:1px solid var(--line);background:var(--paper);padding:19px 23px;border-radius:12px;display:flex;align-items:center;gap:18px}.statIcon{padding:12px;border-radius:12px;background:#eef2e7;font-size:20px}.stat small{color:#8a958b;font-size:11px}.stat strong{font-size:25px;margin-right:6px;font-weight:600}.stat p{margin:7px 0 0}.workspace{display:grid;grid-template-columns:minmax(480px,1fr) 285px;gap:23px}.calendar,.daypanel{border:1px solid var(--line);background:var(--paper);border-radius:13px;overflow:hidden}.calbar{display:flex;align-items:center;justify-content:space-between;padding:23px}.monthtitle{font-size:19px;font-weight:650}.monthtitle span{font-size:11px;color:#98a091;font-weight:400;margin-left:10px}.controls{display:flex;gap:8px;align-items:center}.controls button{border:1px solid #e1e6da;border-radius:5px;padding:6px 10px;font-size:12px}.weekdays{display:grid;grid-template-columns:repeat(7,1fr);background:#f8f9f4;border-top:1px solid var(--line);border-bottom:1px solid var(--line);text-align:center;color:#919a8d;font-size:11px;padding:12px 0}.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}.cell{min-height:103px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:9px 6px;text-align:left;overflow:hidden;cursor:pointer}.cell:nth-child(7n){border-right:0}.cell:hover{background:#f3f6ed}.cell.out{background:#fafbf7;color:#bfc5b9}.cell.selected{background:#edf3e8;box-shadow:inset 0 0 0 1px #8ba481}.num{font:12px Arial;display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;margin-bottom:5px}.today .num{background:var(--green);color:white;border-radius:50%}.event{font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:4px;padding:5px;margin:3px 0;border-left:2px solid var(--color);background:var(--bg);color:var(--color)}.legend{display:flex;gap:18px;padding:15px 22px;color:#939c8e;font-size:10px}.legend .dot{margin-right:6px;width:6px;height:6px}.daypanel{padding:23px 20px;align-self:start;min-height:490px}.dayhead{display:flex;justify-content:space-between;align-items:center}.dayhead h2{font-size:16px;margin:0}.daymeta{color:#99a08f;font-size:11px;margin:10px 0 25px}.schedule{position:relative;border-left:1px solid #e0e5d9;padding-left:17px;margin-left:5px}.item{position:relative;margin-bottom:23px}.item:before{content:'';position:absolute;width:8px;height:8px;border:3px solid var(--paper);border-radius:50%;background:var(--color);left:-25px;top:2px}.itemtime{color:#939c91;font-size:10px;margin-bottom:9px}.itemcard{background:var(--bg);border-radius:8px;padding:13px}.itemcard h3{font-size:13px;margin:8px 0 10px;line-height:1.6}.badge{font-size:9px;color:var(--color)}.details{color:#8d978a;font-size:10px;line-height:1.9}.itembuttons{display:flex;justify-content:space-between;margin-top:10px;font-size:10px;color:#6b7e68}.addoutline{border:1px dashed #ccd7c4;border-radius:7px;width:100%;padding:12px;color:#7b8e70;font-size:12px;margin-top:12px}.footnote{font-size:10px;color:#9ba492;line-height:1.8;margin-top:22px}.quote{padding:24px;text-align:center;color:#98a18d;font-size:11px;letter-spacing:1px}.empty{text-align:center;color:#9ca690;padding:45px 12px;line-height:2;font-size:12px}.listrow{padding:18px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;gap:20px;align-items:center}.listrow:hover{background:#f2f5ed}.listrow small{color:#8a9487}.done{text-decoration:line-through;opacity:.55}dialog{border:1px solid #dbe2d3;border-radius:16px;padding:28px;width:min(480px,94vw);color:var(--ink);background:var(--paper)}dialog::backdrop{background:#243a3266;backdrop-filter:blur(3px)}dialog h2{margin:0 0 20px;font-size:22px}label.field{display:block;font-size:12px;margin-bottom:15px;color:#6d7f70}input,select,textarea{width:100%;border:1px solid #dce2d5;padding:11px;border-radius:7px;margin-top:7px;background:white;color:var(--ink)}.fields{display:flex;gap:15px}.fields>*{flex:1;min-width:0}.modalactions{display:flex;justify-content:space-between;gap:10px;margin-top:22px}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#304e40;color:white;box-shadow:0 6px 30px #22332230;border-radius:10px;padding:16px 25px;z-index:5;max-width:90vw}.hidden{display:none!important}.search{max-width:220px;margin:0;padding:9px 12px;font-size:12px}.monthviewLabel{font-size:11px;color:#87957f;margin-right:6px}@media(min-width:1500px){.cell{min-height:125px}}@media(max-width:1100px){main{padding:28px 20px}.app{grid-template-columns:170px 1fr}aside{padding:30px 15px}.workspace{grid-template-columns:1fr}.daypanel{min-height:0}.schedule{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.cell{min-height:95px}}@media(max-width:700px){.app{display:block}aside{padding:16px 20px;display:block}.logo{font-size:22px}.tagline,aside h4,.filters,.asidebottom{display:none}nav{display:flex;margin-top:12px}nav button{padding:9px;font-size:12px}.top{align-items:start}.actions{flex-direction:column;gap:6px}.notification{padding:8px;font-size:11px}.primary{padding:11px 14px;font-size:12px}h1{font-size:23px}.stats{gap:8px;margin:22px 0}.stat{padding:12px;gap:7px}.statIcon{display:none}.stat strong{font-size:22px}.workspace{display:block}.daypanel{margin-top:18px}.calbar{padding:16px 10px}.monthtitle{font-size:16px}.monthtitle span{display:none}.cell{min-height:85px;padding:6px 2px}.event{padding:3px 2px;font-size:9px}.legend{gap:10px}.schedule{display:block}.search{max-width:140px}}
</style></head><body><div class="app"><aside><div class="logo"><span class="mark">◷</span>日序</div><div class="tagline">把日子，过得有条理</div><nav><button data-view="calendar" class="active"><span class="navicon">▦</span>我的日历</button><button data-view="list"><span class="navicon">☷</span>全部日程</button><button data-view="today"><span class="navicon">◉</span>今日安排</button></nav><h4>日程分类 / CATEGORIES</h4><div class="filters" id="filters"></div><div class="asidebottom"><div class="leaf">❧</div>留一点空白给生活。<br>慢慢来，也是一种前进。</div></aside><main><header class="top"><div><div class="eyebrow">YOUR DAYS, IN HARMONY</div><h1>让每一天，从容有序</h1><div class="subtitle" id="greeting"></div></div><div class="actions"><button class="notification" id="notify">♧ 开启提醒</button><button class="primary" id="new">＋ 新建日程</button></div></header><div class="stats"><div class="stat"><span class="statIcon">▤</span><div><small>今日安排</small><p><strong id="statToday">0</strong><small>项日程</small></p></div></div><div class="stat"><span class="statIcon">▦</span><div><small>本月计划</small><p><strong id="statMonth">0</strong><small>项日程</small></p></div></div><div class="stat"><span class="statIcon">✓</span><div><small>本月已完成</small><p><strong id="statDone">0</strong><small>项日程</small></p></div></div></div><div class="workspace"><section class="calendar"><div class="calbar"><div class="monthtitle" id="monthTitle"></div><div class="controls" id="monthControls"><button id="prev" aria-label="上个月">‹</button><button id="today">今天</button><button id="next" aria-label="下个月">›</button></div><input class="search hidden" id="search" placeholder="搜索标题、地点或备注"></div><div id="calendarBody"><div class="weekdays"><span>周一</span><span>周二</span><span>周三</span><span>周四</span><span>周五</span><span>周六</span><span>周日</span></div><div class="grid" id="grid"></div></div><div id="listBody" class="hidden"></div><div class="legend" id="legend"></div></section><section class="daypanel"><div class="dayhead"><h2 id="dayTitle"></h2><span style="color:#a4ad98">☀</span></div><p class="daymeta" id="dayMeta"></p><div class="schedule" id="schedule"></div><button class="addoutline" id="addDay">＋ 添加这一天的日程</button><p class="footnote">♧ 开启提醒后，重要时刻不再错过。<br>请保持网页打开，以接收准时提醒。</p></section></div><div class="quote">— 有计划的日子，也有不期而遇的美好 —</div></main></div><dialog id="modal"><form id="form"><h2 id="modalTitle">新建日程</h2><label class="field">日程名称<input id="title" required maxlength="80" placeholder="例如：高等数学期中考试"></label><div class="fields"><label class="field">日期<input type="date" id="date" required></label><label class="field">分类<select id="type"></select></label></div><div class="fields"><label class="field">开始时间<input type="time" id="start" required value="09:00"></label><label class="field">结束时间<input type="time" id="end" required value="10:00"></label></div><label class="field">地点<input id="location" maxlength="100" placeholder="教室、会议室或线上会议"></label><label class="field">提醒<select id="reminder"><option value="0">准时提醒</option><option value="5">提前 5 分钟</option><option value="15" selected>提前 15 分钟</option><option value="30">提前 30 分钟</option><option value="60">提前 1 小时</option><option value="1440">提前 1 天</option><option value="-1">不提醒</option></select></label><label class="field">备注<textarea id="notes" rows="2" maxlength="500" placeholder="需要准备什么？"></textarea></label><div class="modalactions"><button type="button" id="delete" style="color:#b96559">删除日程</button><div><button type="button" id="cancel" style="padding:12px">取消</button><button class="primary" type="submit">保存日程</button></div></div></form></dialog><div class="toast hidden" id="toast" role="status"></div><script src="app.js"></script></body></html>
